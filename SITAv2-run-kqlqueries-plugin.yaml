Descriptor:
  Name: SITAv2RunKQLQueries
  DisplayName: SITAv2 Run KQL Queries
  Description: Runs pre-defined KQL queries to return data to be used by SITAv2 agents
  Settings:
    - Name: InstanceURL
      Label: Instance URL
      Description: The URL of the instance to connect to
      HintText: "e.g. https://example.com"
      SettingType: String
      Required: true
      
  SupportedAuthTypes:
    - ApiKey
  Authorization:
    Type: APIKey
    Key: sig
    Location: QueryParams
    AuthScheme: ''

SkillGroups:
  - Format: API
    Settings:
      OpenApiSpecUrl: URL Goes Here
      EndpointUrlSettingName: InstanceURL